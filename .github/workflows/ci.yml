name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  test-and-audit:
    name: test-and-audit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
        total: [6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Harness Core
        uses: actions/checkout@v4
        with:
          repository: vibeforge1111/spark-harness-core
          ref: a78c5bb2137a30a3bd9a543fd5a7cfe662245abd
          path: spark-harness-core
          token: ${{ secrets.SPARK_CI_REPO_TOKEN }}

      - name: Checkout Domain Chip Memory
        uses: actions/checkout@v4
        with:
          repository: vibeforge1111/domain-chip-memory
          ref: 72a660a69c0c4d0ae73cf006c0be9907449295d8
          path: domain-chip-memory
          token: ${{ secrets.SPARK_CI_REPO_TOKEN }}

      - name: Configure private Git dependency auth
        env:
          SPARK_CI_REPO_TOKEN: ${{ secrets.SPARK_CI_REPO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SPARK_CI_REPO_TOKEN}@github.com/vibeforge1111/".insteadOf "https://github.com/vibeforge1111/"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv pip-audit

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked

      - name: Collect complete suite
        env:
          SPARK_HARNESS_CORE_SOURCE: ${{ github.workspace }}/spark-harness-core/src
          DOMAIN_CHIP_MEMORY_REPO: ${{ github.workspace }}/domain-chip-memory
          PYTHONPATH: ${{ github.workspace }}/domain-chip-memory/src
        run: |
          uv run --with pytest python -m pytest tests --collect-only -q > .pytest-nodeids
          uv run python scripts/pytest_shard.py \
            --input .pytest-nodeids \
            --output .pytest-shard-nodeids \
            --shard "${{ matrix.shard }}" \
            --total "${{ matrix.total }}"

      - name: Run complete-suite shard
        env:
          SPARK_HARNESS_CORE_SOURCE: ${{ github.workspace }}/spark-harness-core/src
          DOMAIN_CHIP_MEMORY_REPO: ${{ github.workspace }}/domain-chip-memory
          PYTHONPATH: ${{ github.workspace }}/domain-chip-memory/src
        run: |
          mapfile -t SHARD_NODEIDS < .pytest-shard-nodeids
          uv run --with pytest python -m pytest "${SHARD_NODEIDS[@]}" -q

      - name: Audit Python dependencies
        if: matrix.shard == 0
        run: pip-audit --progress-spinner off .

  full-suite-order-check:
    name: full-suite-order-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Harness Core repo token
        env:
          SPARK_CI_REPO_TOKEN: ${{ secrets.SPARK_CI_REPO_TOKEN }}
        run: |
          if [ -z "$SPARK_CI_REPO_TOKEN" ]; then
            echo "::error::SPARK_CI_REPO_TOKEN is required to checkout private Spark dependencies."
            exit 1
          fi

      - name: Checkout Harness Core
        uses: actions/checkout@v4
        with:
          repository: vibeforge1111/spark-harness-core
          ref: a78c5bb2137a30a3bd9a543fd5a7cfe662245abd
          path: spark-harness-core
          token: ${{ secrets.SPARK_CI_REPO_TOKEN }}

      - name: Checkout Domain Chip Memory
        uses: actions/checkout@v4
        with:
          repository: vibeforge1111/domain-chip-memory
          ref: 72a660a69c0c4d0ae73cf006c0be9907449295d8
          path: domain-chip-memory
          token: ${{ secrets.SPARK_CI_REPO_TOKEN }}

      - name: Configure private Git dependency auth
        env:
          SPARK_CI_REPO_TOKEN: ${{ secrets.SPARK_CI_REPO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SPARK_CI_REPO_TOKEN}@github.com/vibeforge1111/".insteadOf "https://github.com/vibeforge1111/"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked

      - name: Run order-sensitive full suite
        env:
          SPARK_HARNESS_CORE_SOURCE: ${{ github.workspace }}/spark-harness-core/src
          DOMAIN_CHIP_MEMORY_REPO: ${{ github.workspace }}/domain-chip-memory
          PYTHONPATH: ${{ github.workspace }}/domain-chip-memory/src
        run: uv run --with pytest python -m pytest tests -q --durations=25

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
